name: CI/CD Pipeline

on:
  push:
    branches: [ main, v1.1, develop, snapshot-* ]
  pull_request:
    branches: [ main, v1.1, develop ]

jobs:
  security-scan:
    name: 🔒 Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, json, pcov
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Composer Security Audit
        run: composer audit --format=plain
        continue-on-error: false

      - name: Check for known vulnerabilities (Local Security Checker)
        run: |
          # Install local-php-security-checker if not in composer
          if ! composer show --installed | grep -q "security-checker"; then
            curl -L https://github.com/fabpot/local-php-security-checker/releases/download/v2.0.6/local-php-security-checker_2.0.6_linux_amd64 -o local-php-security-checker
            chmod +x local-php-security-checker
            ./local-php-security-checker --path=composer.lock
          fi
        continue-on-error: true

  static-analysis:
    name: 🔍 Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, json

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Install PHPStan
        run: composer require --dev phpstan/phpstan --with-all-dependencies

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --level=6 --memory-limit=1G --error-format=github
        continue-on-error: false

  code-quality:
    name: 📊 Code Quality & Coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, json, pcov
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create .env for testing
        run: |
          cat > .env << EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=hub_test
          DB_USER=root
          DB_PASS=test_password
          GOOGLE_CLIENT_ID=test_client_id
          GOOGLE_CLIENT_SECRET=test_secret
          GOOGLE_REDIRECT_URI=http://localhost/auth/callback
          ALLOWED_DOMAIN=woodsonisd.net
          GOOGLE_SERVICE_ACCOUNT_JSON=config/test-service-account.json
          EOF

      - name: Create test service account JSON
        run: |
          mkdir -p config
          echo '{"type":"service_account","project_id":"test"}' > config/test-service-account.json

      - name: Setup database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/schema.sql
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/modules-schema.sql
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/sections-schema.sql

      - name: Run PHPUnit Tests with Coverage
        run: ./vendor/bin/phpunit --coverage-text --coverage-html=coverage --colors=always

      - name: Check coverage thresholds
        run: |
          COVERAGE=$(./vendor/bin/phpunit --coverage-text | grep "Lines:" | awk '{print $2}' | sed 's/%//')
          echo "Current coverage: $COVERAGE%"

          # Enforce minimum coverage (start at 17%, increase over time)
          MIN_COVERAGE=17
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below minimum $MIN_COVERAGE%"
            exit 1
          fi

          echo "✅ Coverage $COVERAGE% meets minimum $MIN_COVERAGE%"

      - name: Upload coverage reports to Codecov (optional)
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push'
        with:
          files: ./coverage/clover.xml
          fail_ci_if_error: false

      - name: Archive code coverage results
        uses: actions/upload-artifact@v3
        with:
          name: code-coverage-report
          path: coverage/

  security-tests:
    name: 🛡️ Security Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, json, pcov
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create .env for testing
        run: |
          cat > .env << EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=hub_test
          DB_USER=root
          DB_PASS=test_password
          GOOGLE_CLIENT_ID=test_client_id
          GOOGLE_CLIENT_SECRET=test_secret
          GOOGLE_REDIRECT_URI=http://localhost/auth/callback
          ALLOWED_DOMAIN=woodsonisd.net
          GOOGLE_SERVICE_ACCOUNT_JSON=config/test-service-account.json
          EOF

      - name: Create test service account JSON
        run: |
          mkdir -p config
          echo '{"type":"service_account","project_id":"test"}' > config/test-service-account.json

      - name: Setup database schema
        run: |
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/schema.sql
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/modules-schema.sql
          mysql -h 127.0.0.1 -u root -ptest_password hub_test < database/sections-schema.sql

      - name: Run Security Tests (MUST PASS 100%)
        run: |
          echo "🛡️ Running security test suite..."
          ./vendor/bin/phpunit tests/Security/SecurityTest.php --testdox

          # Security tests must pass 100%
          if [ $? -ne 0 ]; then
            echo "❌ SECURITY TESTS FAILED - This is a blocking issue!"
            exit 1
          fi

          echo "✅ All security tests passed!"

      - name: Security Summary
        if: always()
        run: |
          echo "## 🛡️ Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security tests validate:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CSRF protection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ XSS prevention" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SQL injection protection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Authentication/Authorization boundaries" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Session security" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Input validation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ File upload security" >> $GITHUB_STEP_SUMMARY

  quality-gates:
    name: ✅ Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [security-scan, static-analysis, code-quality, security-tests]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "## 📊 CI/CD Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Code Coverage | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Security Tests | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any critical job failed
          if [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.static-analysis.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.security-tests.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Quality gates FAILED** - Please fix issues before merging" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **All quality gates PASSED** - Code is ready to merge!" >> $GITHUB_STEP_SUMMARY
