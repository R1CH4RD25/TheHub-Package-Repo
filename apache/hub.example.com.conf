# The Hub - Apache Virtual Host Configuration Example
# Copy to: /etc/apache2/sites-available/hub.yourdomain.com.conf
#
# Enable with:
#   sudo a2ensite hub.yourdomain.com
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

# HTTP (Port 80) - Redirects to HTTPS
<VirtualHost *:80>
    ServerName hub.yourdomain.com
    ServerAdmin admin@yourdomain.com
    
    # Document root points to 'public' directory
    DocumentRoot /var/www/thehub/public

    # Directory permissions
    <Directory /var/www/thehub/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable .htaccess
        <IfModule mod_rewrite.c>
            RewriteEngine On
        </IfModule>
    </Directory>

    # Deny access to sensitive directories
    <Directory /var/www/thehub/config>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/logs>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/sessions>
        Require all denied
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/hub-error.log
    CustomLog ${APACHE_LOG_DIR}/hub-access.log combined
    
    # Redirect all HTTP to HTTPS
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =hub.yourdomain.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# HTTPS (Port 443) - Main configuration
# Note: SSL certificates are managed by Certbot
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName hub.yourdomain.com
    ServerAdmin admin@yourdomain.com

    # Document root points to 'public' directory
    DocumentRoot /var/www/thehub/public

    # Directory permissions
    <Directory /var/www/thehub/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable .htaccess
        <IfModule mod_rewrite.c>
            RewriteEngine On
        </IfModule>
    </Directory>

    # Deny access to sensitive directories
    <Directory /var/www/thehub/config>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/logs>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/sessions>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/src>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/cli>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/database>
        Require all denied
    </Directory>
    
    <Directory /var/www/thehub/vendor>
        Require all denied
    </Directory>

    # Protect .env file
    <Files .env>
        Require all denied
    </Files>
    
    # Protect .git directory
    <DirectoryMatch "\.git">
        Require all denied
    </DirectoryMatch>

    # Security headers
    <IfModule mod_headers.c>
        # Prevent clickjacking
        Header always set X-Frame-Options "SAMEORIGIN"
        
        # Prevent MIME sniffing
        Header always set X-Content-Type-Options "nosniff"
        
        # Enable XSS protection
        Header always set X-XSS-Protection "1; mode=block"
        
        # Referrer policy
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # Content Security Policy (adjust as needed)
        Header always set Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com;"
        
        # Remove server signature
        Header always unset X-Powered-By
        ServerTokens Prod
        ServerSignature Off
    </IfModule>

    # Logging with enhanced format
    ErrorLog ${APACHE_LOG_DIR}/hub-error.log
    CustomLog ${APACHE_LOG_DIR}/hub-access.log combined
    
    # Log level (change to 'debug' for troubleshooting)
    LogLevel warn

    # SSL Configuration (managed by Certbot)
    SSLEngine on
    
    # Certbot will populate these paths:
    SSLCertificateFile /etc/letsencrypt/live/hub.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hub.yourdomain.com/privkey.pem
    
    # Include SSL options from Certbot
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    # SSL Session Cache
    SSLSessionCache "shmcb:/var/run/apache2/ssl_scache(512000)"
    SSLSessionCacheTimeout 300
    
    # Modern SSL/TLS configuration
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    
    # HSTS (HTTP Strict Transport Security)
    # Uncomment after verifying HTTPS works correctly
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</VirtualHost>
</IfModule>

# Additional performance optimizations
<IfModule mod_deflate.c>
    # Enable compression
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
</IfModule>

<IfModule mod_expires.c>
    # Enable browser caching
    ExpiresActive On
    
    # Images
    ExpiresByType image/jpeg "access plus 1 year"
    ExpiresByType image/png "access plus 1 year"
    ExpiresByType image/gif "access plus 1 year"
    ExpiresByType image/svg+xml "access plus 1 year"
    ExpiresByType image/x-icon "access plus 1 year"
    ExpiresByType image/webp "access plus 1 year"
    
    # CSS and JavaScript
    ExpiresByType text/css "access plus 1 month"
    ExpiresByType application/javascript "access plus 1 month"
    ExpiresByType text/javascript "access plus 1 month"
    
    # Fonts
    ExpiresByType font/woff "access plus 1 year"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType application/font-woff "access plus 1 year"
    ExpiresByType application/font-woff2 "access plus 1 year"
    
    # Default
    ExpiresDefault "access plus 2 days"
</IfModule>

