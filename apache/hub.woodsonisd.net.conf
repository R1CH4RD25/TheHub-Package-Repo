<VirtualHost *:80>
    ServerName hub.woodsonisd.net
    ServerAdmin richard.sullivan@woodsonisd.net

    DocumentRoot /var/www/woodson/thehub/public

    <Directory /var/www/woodson/thehub/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/hub.woodsonisd.net-error.log
    CustomLog ${APACHE_LOG_DIR}/hub.woodsonisd.net-access.log combined

    # Redirect to HTTPS (Certbot will handle this)
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =hub.woodsonisd.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

